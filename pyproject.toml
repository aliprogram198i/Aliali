[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "aliali"
version = "0.1.0"
description = "Modular cyber security operations bot"
requires-python = ">=3.12"
dependencies = [
  "python-telegram-bot>=22.8,<23",
  "pydantic>=2.9,<3",
  "pydantic-settings>=2.6,<3",
  "fastapi>=0.116,<1",
  "uvicorn>=0.35,<1",
  "phonenumbers>=9.0,<10",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<9",
  "pytest-asyncio>=0.24,<1",
  "ruff>=0.8,<1",
]

[project.scripts]
aliali = "aliali.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint.isort]
known-first-party = ["aliali"]
