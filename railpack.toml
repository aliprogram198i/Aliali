# Railpack builder configuration for Aliali (Python/uvicorn API).
#
# Railpack auto-detects this as a Python project and generates its own
# venv-based build/start commands, which overrides the custom commands
# defined in railway.toml. This config disables that auto-detection and
# pins the exact build/start commands and deploy settings we need.

# Disable Railpack's automatic language/provider detection so it does not
# fall back to its default Python venv build and start behavior.
providers = []

[build]
buildCommand = "python -m pip install --target /app/vendor ."

[deploy]
startCommand = "PYTHONPATH=/app/vendor:/app/src python -m uvicorn aliali.api.server:app --host 0.0.0.0 --port $PORT"
healthcheckPath = "/healthz"
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3
